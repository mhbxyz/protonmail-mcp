# protonmail-mcp capability policy
#
# Copy to ~/.config/protonmail-mcp/policy.toml (or point PROTONMAIL_MCP_POLICY at it).
# Every capability is opt-in and enforced server-side; the default is read-only.
#
# Modes are cumulative presets:
#   read -> draft -> organize -> send -> delete
# Individual flags below override the preset (for example, allow send without delete).

[policy]
mode = "read"

[capabilities]
# draft = true      # create/update/delete drafts (Drafts folder only)
# organize = true   # flags, moves, labels, trash
# send = true       # SMTP submission (still requires allowlist and quotas)
# delete = true     # permanent deletion (highest privilege, Trash-only)

[confirmations]
ttl_seconds = 300

[idempotency]
# window_seconds = 300   # 0 disables duplicate-draft suppression

[organize]
max_bulk = 50
protect_drafts = true
# allowed_targets = ["Archive", "Folders/Newsletters"]   # empty = all valid targets
# label_allowlist = ["Labels/Important"]                  # empty = all Labels/* folders

[files]
directory = "~/.local/share/protonmail-mcp/files"
max_bytes = 26214400

[send]
allow_self = true
# allowed_recipients = ["collegue@example.com"]   # exact addresses
# allowed_domains = ["example.com"]               # exact domains
max_recipients = 10
max_per_hour = 20
max_per_day = 100
duplicate_window_seconds = 600
max_thread_depth = 10
max_message_bytes = 26214400
state_path = "~/.local/state/protonmail-mcp/state.db"

[index]
enabled = false
path = "~/.local/state/protonmail-mcp/index.db"
# excluded_folders = ["Spam"]
max_body_chars = 10000

[notifications]
enabled = false
folder = "INBOX"
min_interval_seconds = 30

# Multiple accounts: one Bridge instance per account, one MCP process per profile.
# Select with --profile or PROTONMAIL_MCP_PROFILE; passwords come from the named
# environment variables.
#
# [policy]
# default_profile = "perso"
#
# [profiles.perso]
# username = "perso@proton.me"
# password_env = "PROTONMAIL_BRIDGE_PASSWORD_PERSO"
#
# [profiles.work]
# username = "work@proton.me"
# password_env = "PROTONMAIL_BRIDGE_PASSWORD_WORK"
# imap_port = 2143
# smtp_port = 2025
# mode = "organize"
