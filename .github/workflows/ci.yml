name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Tests with coverage gate
        run: >-
          uv run pytest
          --cov=protonmail_mcp.policy
          --cov=protonmail_mcp.confirmations
          --cov=protonmail_mcp.compose
          --cov=protonmail_mcp.audit
          --cov=protonmail_mcp.idempotency
          --cov=protonmail_mcp.bridge
          --cov=protonmail_mcp.parsing
          --cov-fail-under=88
      - run: uv build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Workflow security (zizmor)
        run: uvx zizmor .
      - name: Dependency audit (pip-audit)
        run: |
          uv export --no-dev --format requirements-txt --no-emit-project --no-header > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt
      - name: Static analysis (semgrep)
        run: >-
          uvx semgrep scan
          --config p/security-audit
          --config p/python
          --error
          --quiet
          src/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
