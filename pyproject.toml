[project]
name = "protonmail-mcp"
version = "0.2.0"
description = "MCP server for Proton Mail via Proton Bridge (IMAP/SMTP)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Manoah BERNIER", email = "manoah.bernier@gmail.com" },
]
keywords = ["mcp", "protonmail", "imap", "email", "proton-bridge", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
    "Typing :: Typed",
]
dependencies = [
    "imapclient>=3",
    "mcp>=2.3",
]

[project.scripts]
protonmail-mcp = "protonmail_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/mhbxyz/protonmail-mcp"
Repository = "https://github.com/mhbxyz/protonmail-mcp"
Issues = "https://github.com/mhbxyz/protonmail-mcp/issues"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protonmail_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "I", "UP", "B", "S", "T20", "BLE"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"src/protonmail_mcp/__main__.py" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
namespace_packages = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["imapclient.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["protonmail_mcp"]
